<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English for POLICE · English Marathon</title>
<style>
:root{--d:#16205b;--m:#2a4fa8;--l:#eaf0fb;--g:#c9d8f5;--ok:#1a8f4c;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--l);color:#12183f}
header{background:#fff;padding:14px 18px}.hin{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:1.9rem;font-weight:800;color:var(--d);letter-spacing:-.02em;line-height:1.2}header p{margin:2px 0 0;font-size:1.15rem;color:var(--m)}
.lg{display:flex;align-items:center;gap:14px}.lg img{height:68px;width:auto;max-width:150px;object-fit:contain;border-radius:4px}.lg i{width:1px;height:50px;background:#cfd8ea}
.chk{height:18px;background:conic-gradient(var(--m) 25%,#fff 0 50%,var(--m) 0 75%,#fff 0) 0 0/18px 18px}
nav{display:flex;flex-wrap:wrap;gap:6px;max-width:980px;margin:0 auto;padding:18px 18px 0;position:sticky;top:0;z-index:5;background:var(--l)}
nav button{padding:12px 18px;border:0;border-bottom:4px solid transparent;border-radius:12px 12px 0 0;background:none;color:var(--m);font:600 1.05rem Inter,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer}
nav button.on{background:#fff;color:var(--d);border-bottom-color:var(--d)}nav button:focus-visible,button:focus-visible{outline:3px solid var(--m)}
main{max-width:980px;margin:auto;padding:0 18px 40px}.tab{display:none}.tab.on{display:block;background:#fff;border:3px solid var(--d);border-radius:24px;padding:22px 26px}
h2{color:var(--d);font-size:1.7rem;font-weight:800;margin:24px 0 8px;letter-spacing:-.01em}.tab h2:first-child{margin-top:4px}h3{color:var(--d);margin:0 0 4px}
.box,.ex{background:var(--l);border-left:8px solid var(--m);border-radius:0 14px 14px 0;padding:14px 18px;margin:14px 0}
.ins{margin:2px 0 10px;color:#34406e}.bank{background:#fff;padding:6px 10px;border-radius:8px;font-size:.92rem}
.it{padding:6px 8px;border-radius:8px;margin:3px 0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.it.ok{background:#dff3e8}.it.bad{background:#fde6e6}
.q{flex:1 1 320px}.res{font-size:.9rem;min-width:30px}.ok .res{color:var(--ok);font-weight:700}.bad .res{color:var(--bad)}
select,input[type=text],input:not([type]),textarea{font:inherit;border:1px solid #9db4e0;border-radius:8px;padding:4px 8px;max-width:100%;background:#fff}
textarea{width:100%;display:block}.it:has(textarea){display:block}
button.b,.deck button{font:600 .92rem Inter,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--m);color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:8px 8px 0 0;cursor:pointer}
button.b.alt{background:#fff;color:var(--m);border:2px solid var(--m)}.score{font-weight:700}
.model{background:#fff;border-radius:8px;padding:6px 10px;margin-top:4px;font-size:.95rem}.wc,.det{font-size:.85rem;color:#34406e}
.ck label{display:block;font-size:.95rem}details{margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--m)}
.deck{background:var(--l);border-left:8px solid var(--m);border-radius:0 14px 14px 0;padding:14px 18px;margin:14px 0}.deck .cnt{text-align:center;font-weight:600;font-size:.9rem;margin-bottom:8px}
.card{perspective:1000px;height:240px;max-width:540px;margin:auto;cursor:pointer}.in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}.card.flip .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;overflow:auto}
.front{background:linear-gradient(135deg,var(--m),var(--d));color:#fff;font-size:1.6rem;font-weight:700}.back{background:#fff;border:3px solid var(--m);transform:rotateY(180deg);font-size:1rem}
.front small{font-size:.8rem;opacity:.85;font-weight:400}.back p{margin:4px 0}.deck .nav{text-align:center}
.deck button.sp{background:var(--g);color:var(--d);margin-top:10px}.note{font-size:.85rem;color:#34406e;text-align:center}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.g3 .box{margin:0}
.w{cursor:pointer;border-radius:3px;padding:0 1px}.w:hover{background:var(--g)}.w.x{text-decoration:line-through;color:var(--bad);font-weight:700}small{font-style:normal}.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:10px}
@media(prefers-reduced-motion:reduce){.in{transition:none}}
</style></head><body>

let V=[];const lv=()=>{V=speechSynthesis.getVoices()};if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv}
function say(t){if(!('speechSynthesis' in window))return alert('Speech is not supported in this browser.');speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,'').replace(/\bsb\b/g,'somebody').replace(/\bsth\b/g,'something').replace(/…/g,' '));

/* ---------- flashcards: [word, English definition, example from reading/video] ---------- */
const HQ=[
["to pick sb’s brain about sth","to ask an experienced person for advice or information, informally","Zeltia wants to pick Carlos’s brain about his time with the UN police mission."],
["to gather one’s thoughts","to pause and organise your ideas before speaking","Zeltia asks for a second to gather her thoughts before her next question."],
["to touch on sth","to mention a subject briefly","Carlos can only touch on the basics; the pre-deployment training covers the rest."],
["to have sth to hand","to have information available immediately","Carlos doesn’t have the exact number of officers to hand."],
["thereabouts","approximately (said after a number)","About 400 officers, or thereabouts, serve in the mission."],
["That’s a valid point","I accept that your argument is reasonable","“That’s a valid point,” says Carlos about the language barrier."],
["Rest assured, …","used to promise someone there is no need to worry","Rest assured, the training covers cross-cultural communication."],
["worthwhile","useful enough to justify the time or effort","Zeltia asks whether the mission is worthwhile despite the risks."],
["in sb’s shoes","in someone else’s situation; used when giving advice","If I were in your shoes, I’d start practising report writing now."],
["to look into sth","to investigate a problem or question","Zeltia will look into the language test requirements this week."],
["in touch","in contact with someone; “We’ll be in touch” means “I will contact you later”","The selection team said, “We’ll be in touch soon.”"]];
const CW=[
["to indoctrinate","to teach someone to accept a set of beliefs without questioning them","Children in occupied territories are being indoctrinated at school."],
["to shunt","to move someone from place to place, often without care","Anastasia was shunted between foster families."],
["to humiliate","to make someone feel ashamed or lose their dignity","Anastasia says she was humiliated and told her mother would not take her back."],
["prominent","well known and important","Katarina Rashevska is a prominent human rights lawyer."],
["to prosecute war crimes","to bring legal action against people accused of breaking the laws of war","The lawyer collects cases so that courts can prosecute war crimes."],
["ombudsman","an official who investigates complaints against authorities","The ombudsman speaks about the rights of children in occupied territories."],
["repressive","controlling people harshly and limiting their freedom","The ombudsman describes life under occupation as repressive."],
["in someone’s eyes","in someone’s opinion","In Anastasia’s eyes, the college was not a safe place."],
["to safeguard sb","to protect someone from harm","International law obliges states to safeguard children in wartime."],
["to wage a war","to carry out a war","A state that wages a war must still protect civilians."],
["in parallel","at the same time, alongside","The fight for children’s rights runs in parallel to the battle on the front lines."],
["eradicate","to destroy something completely, to get rid of it","According to the ombudsman, the plan is to eradicate Ukrainian culture."],
["militarisation","preparing people, here children, for military service","The lawyer says militarisation starts in kindergarten."],
["foster care","a system in which a child lives temporarily with a family chosen by the authorities","Anastasia was placed in foster care after the checkpoint."]];
const DK={hq:HQ,cw:CW,rv:HQ.concat(CW)},DS={};
function deck(id){DS[id]={i:0,o:DK[id].map((_,i)=>i)};return `<div class="deck" data-d="${id}"><div class="cnt"></div><div class="card"><div class="in"><div class="f front"><div class="w"></div><button class="sp" data-s="w">🔊 Listen</button><small>click the card to flip</small></div><div class="f back"><p class="df"></p><p class="exs"><i></i></p><button class="sp" data-s="e">🔊 Example</button></div></div></div><div class="nav"><button data-n="-1">← Previous</button><button data-n="r">🔀 Shuffle</button><button data-n="1">Next →</button></div><p class="note">Voice: UK English (Google UK English in Chrome if available)</p></div>`}
function draw(id){const d=DS[id],c=DK[id][d.o[d.i]],el=$(`.deck[data-d=${id}]`);$('.card',el).classList.remove('flip');
$('.cnt',el).textContent=`Card ${d.i+1} of ${c?DK[id].length:0}`;$('.w',el).textContent=c[0];$('.df',el).innerHTML='<b>'+c[1]+'</b>';$('.exs i',el).textContent='“'+c[2]+'”'}
/* ---------- exercises ---------- */
const EX={};const E=(id,t,i,ty,items,x={})=>(EX[id]={id,t,i,ty,items,...x});
function shf(a,s){let r=()=>(s=s*16807%2147483647)/2147483647;return a.sort(()=>r()-.5)}
function exH(e){let h=`<section class="ex" id="${e.id}"><h3>${e.t}</h3><p class="ins">${e.i}</p>`;if(e.bank)h+=`<p class="bank">${e.bank}</p>`;
e.items.forEach((it,i)=>{const k=e.id+'_'+i;
if(e.ty=='sel'){const o=it[2]||e.o;let ix=o.map((_,j)=>j);if(e.sh)ix=shf(ix,i+3);
h+=`<div class="it" data-i="${i}"><span class="q">${i+1}. ${it[0]}</span><select data-k="${k}"><option value="">—</option>${ix.map(j=>`<option value="${j}">${o[j]}</option>`).join('')}</select><span class="res"></span></div>`}
else if(e.ty=='gap'){const p=it[0].split('___');h+=`<div class="it" data-i="${i}"><span class="q">${i+1}. ${p.map((s,j)=>j<p.length-1?s+`<input data-k="${k}_${j}" size="16" autocomplete="off">`:s).join('')}</span><span class="res"></span></div>`}
else if(e.ty=='fix'){h+=`<div class="it fx" data-i="${i}" data-r="${k}"><span class="q">${i+1}. ${(it[0].match(/\[[^\]]+\]\S*|\S+/g)||[]).map((w,j)=>{const m=w.match(/^\[([^\]]+)\](.*)$/);return m?`<span class="w" data-j="${j}">${m[1]}</span>${m[2]}`:`<span class="w" data-j="${j}">${w}</span>`}).join(' ')}</span><input data-k="${k}" size="14" placeholder="correction" autocomplete="off"><span class="res"></span></div>`}
else if(e.ty=='rw'){h+=`<div class="it" data-i="${i}"><label class="q">${i+1}. ${it[0]}</label><textarea data-k="${k}" rows="2"></textarea><span class="res"></span><div class="model" hidden>Suggested answer: ${it[1]}</div></div>`}
else h+=`<div class="it"><label class="q">${i+1}. ${it[0]}</label><textarea data-k="${k}" rows="${e.rows||2}"></textarea>${e.wc?'<span class="wc"></span>':''}<div class="model" hidden>Suggested answer: ${it[1]||''}</div></div>`});
if(e.det)h+='<p class="det"></p>';
if(e.ck)h+='<div class="ck"><b>Checklist</b>'+e.ck.map((c,j)=>`<label><input type="checkbox" data-k="${e.id}_c${j}"> ${c}</label>`).join('')+'</div>';
if(e.ty!='open')h+=`<button class="b" data-a="chk" data-e="${e.id}">Check answers</button>`;
if(e.ty=='rw'||(e.ty=='open'&&e.items[0][1]))h+=`<button class="b alt" data-a="mod" data-e="${e.id}">Check answer key</button>`;
if(e.ty!='open')h+='<span class="score"></span>';
if(e.ty=='open'&&!e.nobtn)h+=`<button class="b" data-a="cp" data-e="${e.id}">Copy to send to your teacher</button><button class="b alt" data-a="dl" data-e="${e.id}">Download .txt</button>`;
return h+'</section>'}
const nm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/can't/g,'cannot').replace(/won't/g,'will not').replace(/n't/g,' not').replace(/\b(that|there|it|what|who)'s\b/g,'$1 is').replace(/'d\b/g,' would').replace(/'ll\b/g,' will').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'m\b/g,' am').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function chk(e){let sc=0;const s=$('#'+e.id);e.items.forEach((it,i)=>{const r=$(`.it[data-i="${i}"]`,s);let ok,ans;
if(e.ty=='sel'){const v=$('select',r).value;ok=v!==''&&+v==it[1];ans=(it[2]||e.o)[it[1]]}
else if(e.ty=='rw'){const v=nm($('textarea',r).value);ok=v!==''&&it[2].some(a=>nm(a)==v);ans=''}
else if(e.ty=='fix'){const w=$('.w.x',r),cw=w?w.textContent.toLowerCase().replace(/[^a-z ]/g,''):'',v=$('input',r).value.trim().toLowerCase().replace(/'/g,'’');ok=it[1].length?!!(w&&it[1].includes(cw)&&it[2].includes(v)):(!w&&v=='correct');ans=it[1].length?it[1][0]+' → '+it[2][0]:'correct'}
else{const as=it[1].split(';');ok=$$('input',r).every((x,j)=>as[j].split('|').includes(x.value.trim().toLowerCase().replace(/'/g,'’').replace(/\s+/g,' ')));ans=as.map(a=>a.split('|')[0]).join(' / ')}
sc+=ok;r.classList.toggle('ok',ok);r.classList.toggle('bad',!ok);$('.res',r).innerHTML=ok?'✓':'✗ '+ans+(it[3]?' — '+it[3]:'')});$('.score',s).textContent=` ${sc} / ${e.items.length}`}
const txt=e=>'Name: '+(ST.name||'')+'\n'+e.t+'\n\n'+e.items.map((it,i)=>(i+1)+'. '+it[0].replace(/<[^>]+>/g,'')+'\n'+(ST[e.id+'_'+i]||'')).join('\n\n');
function upd(s){const e=EX[s.id];if(!e)return;const all=$$('textarea',s).map(t=>t.value).join(' ');
if(e.wc)$$('textarea',s).forEach(t=>{t.nextElementSibling.textContent=(t.value.split(/\s+/).filter(Boolean).length)+' words'+(e.wc>1?` (aim for ${e.wc})`:'')});
if(e.det)$('.det',s).textContent=e.det.map((g,j)=>e.dl[j]+': '+g.filter(r=>new RegExp(r,'i').test(all)).length).join(' · ')+' found automatically'}

T.hq=`<h2>Part 1 · Handling questions</h2>`+exH(EX.hq1)+`<details><summary>Show the dialogue</summary><div class="box"><p><b>Zeltia:</b> Carlos, have you got a minute? I’d love to pick your brain about your time with the UN police mission. I’m thinking of applying for a deployment.<br><b>Carlos:</b> Of course. Fire away.<br><b>Zeltia:</b> Give me a second to gather my thoughts... Right. What does the work actually involve? I assume it’s mostly monitoring, mentoring and advising local police.<br><b>Carlos:</b> Exactly. UN police usually don’t have executive powers, so you’re there to support, not to take over. I can only touch on the basics now, though. The pre-deployment training goes into much more detail.<br><b>Zeltia:</b> How many police officers are deployed in the mission altogether?<br><b>Carlos:</b> I’m afraid I don’t have the exact figure to hand, but it’s about 400 or thereabouts, from more than twenty countries.<br><b>Zeltia:</b> That’s a lot of nationalities! My main concern is the language barrier and working with local colleagues who have a very different policing culture. I worry I’ll be seen as an outsider.<br><b>Carlos:</b> That’s a valid point, and many newcomers feel the same. But rest assured, the training covers cross-cultural communication, and you’ll be paired with an experienced mentor.<br><b>Zeltia:</b> Good to know. Honestly, though, do you think it’s worthwhile, given the risks and the time away from home?<br><b>Carlos:</b> Absolutely, both professionally and personally.<br><b>Zeltia:</b> I’m fairly confident speaking English, but I’m less sure about writing formal reports.<br><b>Carlos:</b> If I were in your shoes, I’d start practising now. Mission reports are all written in English, and they have to be clear and precise.<br><b>Zeltia:</b> Is there a language test in the selection process?<br><b>Carlos:</b> Probably, but the requirements change, so I’d double-check.<br><b>Zeltia:</b> I’ll look into it this week.<br><b>Carlos:</b> Good. I’ll pass your name to my contact in the selection team. They’ll be in touch soon.</p></div></details><h2>Flashcards</h2>`+deck('hq')+'<h2>Practice</h2>'+['hq2','hq3','hq4','hq5','hq6'].map(x=>exH(EX[x])).join('');

const FR=`<details><summary>Show full rules</summary><div class="box"><h3>Cleft sentences – grammar note</h3><p>In a cleft sentence, information which could be given in one clause is divided into two parts, each with its own verb.<br>(neutral) <i>The Swedish Police Authority is funding our English courses this year.</i><br>(cleft) <i>It is the Swedish Police Authority who is funding our English course this year.</i></p><p>We use this pattern to <b>emphasise new information, give explanations or make a contrast with a previous statement</b>. There are several types: 1. It-clefts; 2. Wh-clefts; 3. other types.</p>
<h3>It-clefts</h3><p><b>It + be + noun + that + the rest of the sentence.</b> The focus is on the emphasised information:</p><ul><li>It is the Swedish Police Authority that is funding our English course this year. (subject emphasised: Swedish police, not any other police)</li><li>It is the English courses that the Swedish Police Authority is funding. (object emphasised: English courses, not something else)</li><li>It is this year that the Swedish Police Authority is funding our English courses. (adverbial emphasised: this year, not any other time)</li></ul><p>We can use <i>when</i> and <i>where</i> (instead of <i>that</i>) in clauses of time and place: <i>It was in January when the test results were published. It’s in Green Street market where the best bargains can be found.</i> We can use <i>who</i> instead of <i>that</i> in spoken English: <i>It was Kyiv that Russians wanted to occupy first.</i></p><p>The noun can be replaced with prepositional phrases, time clauses and reason clauses with <i>because</i>:</p><ul><li>It will be for my mental well-being that I move outside Kyiv for the winter.</li><li>It was only when I got a promotion that I started feeling valued.</li><li>It is because I love my country that I’m not leaving abroad.</li></ul><p>We can reverse <i>it</i> + verb and the emphasised element, but only in a very formal, literary style: <i>And thus Cézanne it was who took the first steps towards Impressionism.</i> Less literary: <i>And so it was Cézanne who took the first steps towards Impressionism.</i></p>
<h3>Wh-clefts</h3><p>We use wh-clefts, not it-clefts, to highlight the action (verb) in a sentence. <b>All/What + subject + do + be + (to-)infinitive clause.</b></p><ul><li>All the officers could do was evacuate the residents and wait for the rescue team.</li><li>What the Russians do is (to) break their promises. (<i>to</i> can be left out in spoken English)</li></ul><p><b>Reversed cleft:</b> the emphasised part goes first. <i>To have more time to spend with my family is all I want. Having more business trips abroad is what most of my coworkers would love to have.</i> What/all can be at the beginning or at the end: <i>All they need is love. / Love is all they need. What they are doing is wasting your time. / Wasting your time is what they are doing. What happened in the end was such a shock.</i></p><p>When telling a story, native speakers often use <i>What happened was …</i>: <i>What happened was that I ordered a Christmas gift for my wife but it arrived too late because of Russia’s air strikes.</i> Sometimes there is a double <i>is</i>: <i>What their company is is a scam.</i></p>
<h3>Other types of cleft sentences</h3><p>We can use wh-clauses with <i>when, where, why</i> and <i>who</i> to highlight a time, place, reason or person, but we usually use an introductory noun phrase instead (<i>the time, the place, the reason, the person</i>):</p><ul><li>I was happy when I was a student. → The time (when) I was a student was one of the happiest periods of my life.</li><li>Yugoslavia isn’t on the map any more. → The country (where) he was born in is no longer on the map.</li><li>I love helping people, so I chose this job. → The reason (why) I chose this job is I love helping people.</li><li>A stranger helped me. → The person who helped me was a stranger.</li></ul><p>The wh-clause acts like an ordinary relative clause. We can emphasise a noun phrase or verb phrase with <i>(only/last) thing, something</i> or <i>all</i>:</p><ul><li>The thing (that) I most disliked about the movie was the scene in the graveyard.</li><li>The only thing (that) they want is a chance to air their grievances.</li><li>The last thing (that) we did was (to) pack the kettle.</li><li>Something the surveyor neglected to mention was the damp in the kitchen.</li><li>All (that) we’re asking for is to be given a chance.</li></ul><p>We can also use <i>the one/only thing/person</i> with a negative verb:</p><ul><li>The one thing (that) this shop won’t do is repair goods bought in other shops.</li><li>The only thing (that) we didn’t find was the key to the cellar.</li><li>The one person (that) I didn’t want to see just then walked into the room.</li></ul></div></details>`;
T.cl=`<h2>Part 3 · Cleft sentences</h2>`+bx(`<p>In the video the lawyer says: <i>“What we are fighting for is for the absence of war for these children…”</i> This is a <b>cleft sentence</b>: information that could be given in one clause is divided into two parts, each with its own verb. We use clefts to emphasise new information, give explanations or contrast with a previous statement.</p><p>Neutral: <i>The Swedish Police Authority is funding our English course this year.</i><br>Emphasised: <i>It is the Swedish Police Authority that is funding our English course this year.</i></p>`)+`<div class="g3"><div class="box"><h3>It-clefts</h3><p>Emphasis on a noun, prepositional phrase, time clause or reason clause.<br><b>It + be + X + that + rest of sentence</b> (<i>who, when, where</i> are possible)</p><ul><li>It is the Swedish Police Authority that is funding our English course.</li><li>It will be for my mental well-being that I move outside Kyiv.</li><li>It was only when I got a promotion that I started feeling valued.</li><li>It is because I love my country that I’m not leaving.</li></ul></div><div class="box"><h3>What / All-clefts</h3><p>Emphasis on an action.<br><b>What/All + subject + do + be + (to-)infinitive</b>; <i>to</i> is often dropped in speech. They can be reversed.</p><ul><li>All the officers could do was evacuate the residents and wait for the rescue team.</li><li>What the Russians do is break their promises.</li><li>All they need is love. / Love is all they need.</li><li>What happened in the end was such a shock.</li></ul></div><div class="box"><h3>Other clefts</h3><p>The time / place / reason / person + clause + be; the (only / last) thing; something …</p><ul><li>The time (when) I was a student was one of the happiest periods of my life.</li><li>The reason (why) I chose this job is I love helping people.</li><li>The only thing (that) we didn’t find was the key to the cellar.</li><li>Something the surveyor neglected to mention was the damp in the kitchen.</li></ul></div></div>`+FR+'<h2>Practice</h2>'+['cl1','cl2','cl3'].map(x=>exH(EX[x])).join('');
