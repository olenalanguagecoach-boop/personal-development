<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C1/C2 Vocab Trainer 2</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--mut:#777;--card:#fff;--bd:#ddd5c8;--ac:#b4472f;--ok:#2f7d4f;--no:#b32d2d;--chip:#f1e9dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1917;--fg:#eee;--mut:#9a948b;--card:#262320;--bd:#3d3833;--ac:#e8806a;--ok:#6fcf97;--no:#f08080;--chip:#332e29}}
:root[data-theme="dark"]{--bg:#1b1917;--fg:#eee;--mut:#9a948b;--card:#262320;--bd:#3d3833;--ac:#e8806a;--ok:#6fcf97;--no:#f08080;--chip:#332e29}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 10px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:230px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.w{font-size:1.6rem;font-weight:bold}
.back{text-align:left}
em,.muted{color:var(--mut)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;font-size:.88rem}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.q{font-size:1.15rem;margin:8px 0 14px}
.bl{border-bottom:2px solid var(--ac);padding:0 8px}
.opts{display:grid;gap:8px}
.opt{text-align:left}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.big{font-size:1.4rem}
.gr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.gr h3{margin:0 0 4px;font-size:1rem;color:var(--ac)}
.gr p{margin:4px 0}
</style></head><body><main>
<h1>🧠 C1/C2 Vocab Trainer 2</h1>
<nav id="nav"></nav>
<section id="v"></section>
<script>
const D=[
{w:"heaviness in the stomach",d:"an uncomfortable feeling of fullness (or of anxiety)",ex:"After the big lunch I felt a heaviness in the stomach.",col:["feel a heaviness in the stomach","a heavy feeling","sit heavy on the stomach"],ctx:"After the big lunch I felt a ___ and couldn't work.",f:"heaviness in the stomach"},
{w:"across the board",d:"applying to everyone or everything in a group",ex:"The cuts will apply across the board.",col:["across-the-board cuts / rises","apply across the board","improve across the board"],ctx:"The cuts will apply ___, so no department is exempt.",f:"across the board"},
{w:"to space meals 3–3.5 hours apart",d:"to leave a regular gap between meals",ex:"Meals should be spaced three to three and a half hours apart.",col:["space sth out","evenly spaced","well spaced","spaced three hours apart"],ctx:"Nutritionists advise you to ___ your meals three hours apart.",f:"space"},
{w:"member of parliament (MP)",d:"an elected representative in parliament",ex:"Our local MP promised to raise the issue in the House.",col:["an MP for + constituency","an elected MP","MPs vote on a bill"],ctx:"Our local ___ promised to raise the issue in the House.",f:"MP"},
{w:"territorial recruitment centre (TCC)",d:"Ukrainian military recruitment / enlistment office (also: military recruitment centre)",ex:"He was summoned to the territorial recruitment centre to update his records.",col:["report to the recruitment centre","be summoned to","update military records"],ctx:"He was summoned to the ___ to update his military records.",f:"territorial recruitment centre"},
{w:"keep / have one's finger on the pulse",d:"stay fully informed about the latest developments",ex:"A good manager keeps a finger on the pulse of the team.",col:["keep a finger on the pulse of sth","lose touch with","on the pulse of"],ctx:"A good manager always ___ on the pulse of the team.",f:"keeps a finger"},
{w:"notch",d:"a level or degree on a scale",ex:"Her second book was a few notches better than her first.",col:["a notch above / below","take it up a notch","top-notch","notch up (a win)"],ctx:"Her second book was a few ___ better than her first.",f:"notches"},
{w:"to discount sth",d:"to treat as unlikely or unimportant, or to reduce a price",ex:"We can't discount the possibility that the data is wrong.",col:["discount the possibility of / that","discount a rumour","heavily discounted"],ctx:"We can't ___ the possibility that the data is wrong.",f:"discount"},
{w:"dry cleaning",d:"clothes cleaned with chemicals instead of water; the service itself (uncountable)",ex:"I need to pick up my dry cleaning before the shop closes.",col:["pick up the dry cleaning","take sth to the dry cleaner's","dry-clean (v)"],ctx:"I need to pick up my ___ before the shop closes.",f:"dry cleaning"},
{w:"club (= a stick)",d:"a heavy stick used as a weapon (police: baton / truncheon)",ex:"The protester was hit with a club.",col:["beat sb with a club","a wooden club","club sb to death (v)"],ctx:"The protester was hit with a ___.",f:"club"},
{w:"a detail / duty assignment (= наряд)",d:"a small group of officers assigned to a specific duty; best equivalent of наряд. NOT 'work order' (= a maintenance job ticket)",ex:"Two officers were detailed to the night patrol.",col:["a patrol detail","be detailed to do sth","be on duty","duty roster"],ctx:"Two officers were ___ to the night patrol.",f:"detailed"},
{w:"administrative department (канцелярія)",d:"the office that handles registration, records and paperwork",ex:"Send the document to the administrative department for registration.",col:["the admin / records office","clerical staff","register a document"],ctx:"Send the document to the ___ for registration.",f:"administrative department"},
{w:"turning point",d:"a moment when an important change begins",ex:"The 2022 election proved to be the turning point for the party.",col:["a major / critical turning point","mark a turning point","reach a turning point in sth"],ctx:"The 2022 election proved to be the ___ for the party.",f:"turning point"},
{w:"unmanned systems",d:"vehicles or machines operated without a crew on board (drones, robots); also 'uncrewed'",ex:"The army is investing heavily in unmanned systems.",col:["unmanned aerial vehicle (UAV)","unmanned ground vehicle","an unmanned systems unit"],ctx:"The army is investing heavily in ___ such as drones.",f:"unmanned systems"},
{w:"tourniquet",d:"a tight band that stops severe bleeding from a limb (/ˈtʊənɪkeɪ/)",ex:"He applied a tourniquet above the wound.",col:["apply a tourniquet","tighten a tourniquet","a combat tourniquet"],ctx:"He applied a ___ above the wound to stop the bleeding.",f:"tourniquet"},
{w:"turnstile",d:"a rotating gate that lets one person through at a time",ex:"You need a card to go through the turnstile at the metro.",col:["go through the turnstile","jump the turnstile","swipe a card at the turnstile"],ctx:"You need a card to go through the ___ at the metro.",f:"turnstile"}
];
const CO=[
{q:"a ___ above",a:"notch",o:["nick","cut","step"]},
{q:"to take it up a ___",a:"notch",o:["rung","stair","slice"]},
{q:"top-___ service",a:"notch",o:["step","level","mark"]},
{q:"keep your finger on the ___",a:"pulse",o:["heart","vein","wrist"]},
{q:"across-the-___ cuts",a:"board",o:["table","floor","wall"]},
{q:"to discount the ___ of failure",a:"possibility",o:["possible","possibly","probable"]},
{q:"to mark a ___ point",a:"turning",o:["twisting","spinning","bending"]},
{q:"an ___ aerial vehicle",a:"unmanned",o:["unmanaged","unmanly","unmaned"]},
{q:"meals spaced three hours ___",a:"apart",o:["away","off","aside"]},
{q:"to jump the ___",a:"turnstile",o:["tourniquet","pulse","notch"]}
];
const GRN=[
["notch","'a few notches better' – quantifier + notches + comparative. Also: take it up a notch, a notch above, top-notch (adj.), notch up a win (phr. v.)."],
["discount","'discount' + noun, or + the possibility OF/THAT: 'We can't discount the possibility that…' (not 'discount that…'). Also = reduce a price."],
["keep a finger on the pulse","Followed by OF: keep a finger on the pulse of the market. Subject is possessive: keep/have one's finger on the pulse."],
["space + object + apart","'Space the meals three hours apart' / 'spaced out'. 'Apart' follows the distance; 'space out' also means to lose focus (informal)."],
["uncountable nouns","'dry cleaning' is uncountable: some / my / a bit of dry cleaning. The verb is hyphenated: to dry-clean. The shop: the dry cleaner's."],
["be detailed to do sth","'detail' as a verb: Two officers were detailed to guard the gate. Noun: a patrol detail. 'Work order' is a maintenance ticket, not a police assignment."]
];
const GR=[
{q:"We can't discount ___ that he is lying.",a:"the possibility",o:["possible","the possibly","a possible"],e:"discount + the possibility (that…)."},
{q:"The government announced an ___ pay rise.",a:"across-the-board",o:["across the board","across-board","the across board"],e:"Before a noun it is hyphenated: across-the-board."},
{q:"She's a few notches ___ than the others.",a:"better",o:["more good","best","well"],e:"a few notches + comparative."},
{q:"Which is correct?",a:"I need to collect some dry cleaning.",o:["I need to collect a dry cleaning.","I need to collect dry cleanings.","I need to collect some dry cleanings."],e:"Dry cleaning is uncountable."},
{q:"Two officers were ___ to guard the entrance.",a:"detailed",o:["detail","detailing","details"],e:"be detailed to do sth (passive of the verb 'detail')."},
{q:"He keeps his finger ___ the pulse of the market.",a:"on",o:["in","at","to"],e:"on the pulse (of sth)."}
];
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const V=document.getElementById("v"),known=new Set();
function quiz(items){
  let o=sh(items),i=0,s=0,done=false;
  (function draw(){
    done=false;
    if(i>=o.length){V.innerHTML=`<p class="big">Score: ${s}/${o.length}</p><button id="r">Try again</button>`;document.getElementById("r").onclick=()=>{o=sh(items);i=0;s=0;draw()};return}
    const t=o[i];
    V.innerHTML=`<p class="muted">${i+1} / ${o.length} · score ${s}</p><p class="q">${t.q.replace("___",'<span class="bl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</p><div class="opts">${sh(t.o.concat(t.a)).map(x=>`<button class="opt">${x}</button>`).join("")}</div><div id="fb"></div>`;
    V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(done)return;done=true;
      const ok=b.textContent===t.a;if(ok)s++;
      V.querySelectorAll(".opt").forEach(x=>{if(x.textContent===t.a)x.classList.add("ok");else if(x===b)x.classList.add("no")});
      document.getElementById("fb").innerHTML=`<p>${ok?"✅ Correct.":"❌ Answer: <b>"+t.a+"</b>."} ${t.e||""}</p><button id="n">Next →</button>`;
      document.getElementById("n").onclick=()=>{i++;draw()};
    });
  })();
}
function cards(){
  let list=D,i=0,flip=false;
  function draw(){
    const t=list[i];
    V.innerHTML=`<div class="card" id="c">${flip?`<div class="back"><p><b>${t.w}</b> – ${t.d}</p><p><em>${t.ex}</em></p><div>${t.col.map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>`:`<div class="w">${t.w}</div><p class="muted">tap to flip</p>`}</div>
    <div class="row"><button id="p">←</button><span class="muted">${i+1}/${list.length} · ${known.size} known</span><button id="nx">→</button><button id="k">${known.has(t.w)?"✓ Known":"Mark as known"}</button><button id="s">Shuffle</button></div>`;
    document.getElementById("c").onclick=()=>{flip=!flip;draw()};
    document.getElementById("p").onclick=()=>{i=(i-1+list.length)%list.length;flip=false;draw()};
    document.getElementById("nx").onclick=()=>{i=(i+1)%list.length;flip=false;draw()};
    document.getElementById("k").onclick=()=>{known.has(t.w)?known.delete(t.w):known.add(t.w);draw()};
    document.getElementById("s").onclick=()=>{list=sh(list);i=0;flip=false;draw()};
  }
  draw();
}
function grammar(){
  V.innerHTML=GRN.map(x=>`<div class="gr"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")+`<div class="row"><button id="gq">Practise grammar →</button></div>`;
  document.getElementById("gq").onclick=()=>setTab(4);
}
const T=[["Cards",cards],["In context",()=>quiz(D.map(x=>({q:x.ctx,a:x.f,o:sh(D.filter(y=>y!==x)).slice(0,3).map(y=>y.f),e:`<br><b>${x.w}</b>: ${x.d}.`})))],["Collocations",()=>quiz(CO)],["Grammar",grammar],["Grammar quiz",()=>quiz(GR)]];
const N=document.getElementById("nav");
function setTab(n){N.innerHTML=T.map((t,j)=>`<button class="${j===n?"on":""}" data-j="${j}">${t[0]}</button>`).join("");N.querySelectorAll("button").forEach(b=>b.onclick=()=>setTab(+b.dataset.j));T[n][1]()}
setTab(0);
</script></main></body></html>
